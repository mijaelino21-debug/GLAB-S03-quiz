{% extends "quiz/base.html" %}

{% block content %}
<h1>Exámenes</h1>
<ul>
    {% for exam in exams %}
    <li>
        <a href="{% url 'quiz:exam_detail' exam.pk %}">{{ exam.title }}</a>
        <p>{{ exam.description }}</p>
        <small>{{ exam.created_at }}</small>
    </li>
    {% endfor %}
</ul>
{% endblock %}
