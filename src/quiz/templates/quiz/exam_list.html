{% extends "quiz/base.html" %}

{% block content %}
<h1>Exámenes</h1>
{% for exam in exams %}
    <div class="card">
        <h2>{{ exam.title }}</h2>
        <p>{{ exam.description }}</p>
        <small>Creado el: {{ exam.created_at|date:"d/m/Y" }}</small>
        <br><br>
        <a href="{% url 'quiz:exam_detail' exam.pk %}" class="btn">Ver examen</a>
    </div>
{% endfor %}
{% endblock %}
